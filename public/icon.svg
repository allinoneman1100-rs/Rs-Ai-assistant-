<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#060916" />
      <stop offset="100%" stop-color="#180c2e" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Pulse Rings -->
  <circle cx="256" cy="236" r="160" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="236" r="130" fill="none" stroke="#ec4899" stroke-width="3" stroke-opacity="0.35" />

  <!-- Central Holographic Core -->
  <circle cx="256" cy="236" r="95" fill="#0c142c" stroke="url(#neonCyan)" stroke-width="4" filter="url(#glow)" />

  <!-- Microphone & Soundwave Icon -->
  <path d="M256 160 C242.7 160 232 170.7 232 184 L232 232 C232 245.3 242.7 256 256 256 C269.3 256 280 245.3 280 232 L280 184 C280 170.7 269.3 160 256 160 Z" fill="url(#neonCyan)" />
  <path d="M216 220 C216 242.1 233.9 260 256 260 C278.1 260 296 242.1 296 220" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <path d="M256 260 L256 286 M232 286 L280 286" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

  <!-- Equalizer soundwaves -->
  <rect x="176" y="220" width="8" height="32" rx="4" fill="#06b6d4" />
  <rect x="194" y="205" width="8" height="62" rx="4" fill="#3b82f6" />
  <rect x="310" y="205" width="8" height="62" rx="4" fill="#a855f7" />
  <rect x="328" y="220" width="8" height="32" rx="4" fill="#ec4899" />

  <!-- RS AI ASSISTANT Branding Text -->
  <text x="256" y="380" font-family="'Orbitron', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    RS AI
  </text>
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#06b6d4" text-anchor="middle" letter-spacing="8">
    VOICE ASSISTANT
  </text>
</svg>
